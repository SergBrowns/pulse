name: iOS CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Установить XcodeGen
        run: brew install xcodegen
      - name: Сгенерировать Xcode-проект
        run: xcodegen generate
      - name: Выбрать симулятор и запустить тесты
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project Pulse.xcodeproj \
            -scheme Pulse \
            -destination "platform=iOS Simulator,id=$DEVICE_ID,arch=arm64" \
            CODE_SIGNING_ALLOWED=NO

