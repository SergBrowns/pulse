name: Pulse
options:
  bundleIdPrefix: com.pulse
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - path: Pulse
        excludes:
          - Info.plist
    info:
      path: Pulse/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.calendar
        PRODUCT_NAME: Pulse
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets:
        - PulseTests
  PulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PulseTests
    dependencies:
      - target: Pulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.calendar.tests

